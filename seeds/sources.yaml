# Source registry (PLAN §4.1). github_repo and npm cover every entity key of
# that type; the rest list their targets here. Changes go through PR.
- { slug: github-tracked, kind: github_repo, tier: T0, interval: 600, config: {} }
- { slug: npm-tracked, kind: npm, tier: T0, interval: 300, config: {} }
- slug: discourse-threejs
  kind: discourse
  tier: T0
  interval: 600
  config: { base: https://discourse.threejs.org, categories: [showcase, resources, discussion], backfill_days: 10 }
- slug: hn
  kind: hn
  tier: T0
  interval: 300
  config:
    queries: [three.js, threejs, webgpu, webgl, gaussian splatting, react three fiber, babylon.js, playcanvas, procedural generation, text-to-3d, image-to-3d, world model]
    backfill_days: 7
- { slug: reddit-threejs, kind: reddit, tier: T1, interval: 1800, config: { url: https://www.reddit.com/r/threejs/.rss } }
- { slug: webgpu-com, kind: rss, tier: T1, interval: 1800, config: { url: https://www.webgpu.com/rss.xml } }
- { slug: chrome-blog, kind: rss, tier: T1, interval: 3600, config: { url: https://developer.chrome.com/static/blog/feed.xml, keywords: [webgpu, webgl, gpu, wgsl, webxr] } }
- { slug: babylonjs-blog, kind: rss, tier: T1, interval: 3600, config: { url: https://babylonjs.medium.com/feed } }
- { slug: hf-blog, kind: rss, tier: T1, interval: 3600, config: { url: https://hf.co/blog/feed.xml, keywords: [3d, mesh, gaussian, splat, world model, game, texture, rig] } }
- slug: arxiv
  kind: arxiv
  tier: T2
  interval: 3600
  config:
    categories: [cs.GR]
    keyword_categories: [cs.CV, cs.AI, cs.HC, cs.LG]
    keywords: [gaussian splatting, 3D generation, text-to-3D, image-to-3D, mesh generation, 3D asset, texture generation, procedural generation, world model, game generation, neural rendering, WebGPU, WebGL, rigging]
    backfill_days: 8
- { slug: hf-daily-papers, kind: hf_papers, tier: T1, interval: 1800, config: { backfill_days: 8 } }
- { slug: hf-models-3d, kind: hf_models, tier: T1, interval: 1800, config: { pipeline_tags: [image-to-3d, text-to-3d], backfill_days: 3, max_cards: 60 } }
# Stream, not polled: the worker keeps it connected. interval is the expected
# flush period, so the health page can flag it when it goes quiet.
- slug: bluesky
  kind: bluesky
  tier: T0
  interval: 60
  # Off on the free plan (no always-on Durable Object); keywords rarely match anyway.
  enabled: false
  config:
    keywords: [three.js, threejs, webgpu, webgl, wgsl, gaussian splatting, gaussian splat, react three fiber, babylon.js, babylonjs, playcanvas, "#gamedev #webgl", procedural generation]
    dids: []
    skip_replies: true
