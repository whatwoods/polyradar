insights:
  - entities: [meep]
    claim_zh: WebGPU 管线编译无法缓存，小特效用 compute 内的虚拟机比逐特效着色器更划算。
    claim_en: WebGPU pipeline compilation cannot be cached, so a VM inside one compute shader beats per-effect shaders for small effects.
    author: Alex Goldring
    evidence_level: E0
    evidence: https://discourse.threejs.org/t/gpu-driven-particle-system/94233
  - entities: [nine-loops-subway, three]
    claim_zh: 用 renderer.compileAsync 预热着色器，新物体首次出现约省 0.9 秒。
    claim_en: Warming shaders with renderer.compileAsync saves about 0.9 s when a new object first appears.
    author: DESIGN OFFICE NINE
    reported_effect: 约 0.9 秒
    evidence_level: E0
    evidence: https://discourse.threejs.org/t/nine-loops-subway-an-exit-8-style-anomaly-loop-game-in-three-js-mobile-en-ja-online-leaderboard/95932

